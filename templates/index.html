<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wine Quality Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #4b0f1f,
                #8b1e3f
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .container {

            width: 90%;
            max-width: 900px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);

        }


        h1 {

            text-align: center;

            color: #6b1028;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

        }


        label {

            font-weight: bold;

            margin-bottom: 7px;

            color: #333;

        }


        input {

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #8b1e3f;

        }


        button {

            width: 100%;

            margin-top: 30px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #8b1e3f;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #6b1028;

        }


        .result {

            margin-top: 30px;

            padding: 20px;

            border-radius: 10px;

            background: #f5e6eb;

            text-align: center;

        }


        .result h2 {

            color: #6b1028;

        }


        .quality {

            font-size: 40px;

            font-weight: bold;

            color: #8b1e3f;

        }


        @media(max-width: 700px) {

            .form-grid {

                grid-template-columns: 1fr;

            }

            .container {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>🍷 Wine Quality Prediction</h1>

    <p class="subtitle">
        Enter the wine chemical properties
        to predict its quality.
    </p>


    <form action="/predict"
          method="POST">


        <div class="form-grid">


            <div class="form-group">

                <label>Fixed Acidity</label>

                <input
                    type="number"
                    step="any"
                    name="fixed acidity"
                    placeholder="Example: 7.4"
                    required>

            </div>


            <div class="form-group">

                <label>Volatile Acidity</label>

                <input
                    type="number"
                    step="any"
                    name="volatile acidity"
                    placeholder="Example: 0.70"
                    required>

            </div>


            <div class="form-group">

                <label>Citric Acid</label>

                <input
                    type="number"
                    step="any"
                    name="citric acid"
                    placeholder="Example: 0.00"
                    required>

            </div>


            <div class="form-group">

                <label>Residual Sugar</label>

                <input
                    type="number"
                    step="any"
                    name="residual sugar"
                    placeholder="Example: 1.9"
                    required>

            </div>


            <div class="form-group">

                <label>Chlorides</label>

                <input
                    type="number"
                    step="any"
                    name="chlorides"
                    placeholder="Example: 0.076"
                    required>

            </div>


            <div class="form-group">

                <label>Free Sulfur Dioxide</label>

                <input
                    type="number"
                    step="any"
                    name="free sulfur dioxide"
                    placeholder="Example: 11"
                    required>

            </div>


            <div class="form-group">

                <label>Total Sulfur Dioxide</label>

                <input
                    type="number"
                    step="any"
                    name="total sulfur dioxide"
                    placeholder="Example: 34"
                    required>

            </div>


            <div class="form-group">

                <label>Density</label>

                <input
                    type="number"
                    step="any"
                    name="density"
                    placeholder="Example: 0.9978"
                    required>

            </div>


            <div class="form-group">

                <label>pH</label>

                <input
                    type="number"
                    step="any"
                    name="pH"
                    placeholder="Example: 3.51"
                    required>

            </div>


            <div class="form-group">

                <label>Sulphates</label>

                <input
                    type="number"
                    step="any"
                    name="sulphates"
                    placeholder="Example: 0.56"
                    required>

            </div>


            <div class="form-group">

                <label>Alcohol</label>

                <input
                    type="number"
                    step="any"
                    name="alcohol"
                    placeholder="Example: 9.4"
                    required>

            </div>


        </div>


        <button type="submit">
            Predict Wine Quality
        </button>


    </form>


    {% if prediction is not none %}

    <div class="result">

        <h2>Predicted Wine Quality</h2>

        <div class="quality">
            {{ prediction }}
        </div>

        <p>
            Higher quality score generally indicates
            better wine quality.
        </p>

    </div>

    {% endif %}


</div>


</body>

</html>
